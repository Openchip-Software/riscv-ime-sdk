# The hosted runner leaves ~14 GB free on /, and a crosstool-NG build
# needs more. Delete preinstalled SDKs that the component builds never use.
# This reclaims 25-30 GB in about a minute.
name: Free disk space
description: Delete preinstalled SDKs and images that the component builds do not use

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
          /usr/local/share/boost /usr/local/share/powershell \
          /usr/local/share/chromium /usr/local/julia* /usr/lib/jvm \
          /opt/microsoft /opt/google /opt/az
        docker image prune -af >/dev/null
        df -h /
