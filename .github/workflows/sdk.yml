# Builds and publishes the IME SDK component images: the crosstool-NG
# toolchain and qemu. Each is built from source, and only when GHCR does not
# already hold an image with the same inputs. The full SDK image is
# assembled from them as a check, and is never pushed.
#
#   resolve ──> component (matrix, only missing images) ──> sdk
#
# The component images are FROM scratch: they hold only /opt/openchip/<component>.
# Users assemble an SDK image from them with
# build/sdk/Dockerfile; see "Quick start" in README.md.
#
# The toolchain and qemu images are tagged with the git tree hash of
# build/<component>, which contains every input of the image: Dockerfile,
# configuration and pins. The tag is a function of the inputs, not of the
# branch, so a component built on a feature branch is reused by main after
# the merge and by every other branch with the same inputs. A change outside
# build/<component> never rebuilds it.
#
# Images under the tree-hash tag are a build cache keyed by their inputs.
# They are pushed from every run in this repository, pull requests
# included. Pull requests from forks cannot push; see the condition of the
# component job.
#
# The sdk job assembles the SDK image from the component images in minutes
# and keeps only the build cache. When the assembly succeeds, it adds a
# release name to both component images, depending on the trigger:
#
#   push to main                     -> no release name
#   pull request                     -> no release name
#   tag openchip-vYYYY.MM.DD         -> :openchip-vYYYY.MM.DD, then :latest
#                                       moves to it
#   workflow_dispatch, publish=on    -> :openchip-v<short-sha>
#
# A release tag must be openchip-v<sdk_version>, with sdk_version read from
# sdk.lock.yaml. The resolve job fails otherwise, before anything is pushed.
#
# To release: bump sdk_version in components.yaml, run `make lock`, merge,
# then push the tag openchip-v<sdk_version> (or create a GitHub Release with
# that tag).
#
# To publish test component images from any branch, run this workflow from
# the Actions tab on that branch with "publish" checked. It never moves
# :latest.
#
# A manual run with from-scratch rebuilds both components with no cache
# under separate -verify-<run> tags. This catches builds that no longer
# reproduce. These runs never add a release name.
#
# GHCR is authenticated by the built-in GITHUB_TOKEN.
name: sdk

on:
  pull_request:
  # A GitHub Release creates its tag, which triggers this push event. A
  # release event trigger would run the workflow a second time.
  push:
    branches: [main]
    tags: ['openchip-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Tag the component images as openchip-v<short-sha>
        type: boolean
        default: false
      from-scratch:
        description: Rebuild every component with no cache, ignoring existing images
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# No workflow-level concurrency: a newer push must not cancel a component
# build that takes hours and that the newer run would reuse. The sdk job
# carries the per-ref rule instead.

env:
  # Docker rejects uppercase repository names, and github.repository_owner
  # is "Openchip-Software"; expressions have no lowercase function.
  REGISTRY: ghcr.io/openchip-software
  BAKE_FILES: |
    docker-bake.hcl
    build/toolchain/pins.hcl
    build/qemu/pins.hcl
    build/sdk/pins.hcl
  # The sdk job writes its own summary of the images. The build record
  # artifact and the bake-action summary repeat the build log.
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY:       false

jobs:
  resolve:
    runs-on: ubuntu-26.04
    outputs:
      build:          ${{ steps.r.outputs.build }}
      toolchain:      ${{ steps.r.outputs.toolchain }}
      toolchain-tree: ${{ steps.r.outputs.toolchain-tree }}
      qemu:           ${{ steps.r.outputs.qemu }}
      qemu-tree:      ${{ steps.r.outputs.qemu-tree }}
      from-scratch:   ${{ steps.r.outputs.from-scratch }}
    steps:
      # On a pull request this is the merge commit: the trees that would land.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-yq
        if: github.event_name == 'push' && github.ref_type == 'tag'

      # The image tag of a release is the git tag, and the version label of
      # the image is sdk_version from the lock. Both must name the same
      # release. Fail here, before any component image is pushed or tagged.
      - name: Check the release tag against sdk_version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version=$(yq -r '.sdk_version' sdk.lock.yaml)
          if ! [[ "$GITHUB_REF_NAME" =~ ^openchip-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not openchip-vYYYY.MM.DD"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "openchip-v$version" ]; then
            echo "::error::release tag '$GITHUB_REF_NAME' != openchip-v<sdk_version> 'openchip-v$version'." \
                 "Bump sdk_version in components.yaml, run 'make lock', merge, and tag that commit."
            exit 1
          fi
          echo "release $GITHUB_REF_NAME matches sdk_version $version"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Outputs the image reference and the tree hash of each component,
      # and the list of components whose image does not exist yet.
      - name: Resolve component images
        id: r
        env:
          FROM_SCRATCH: ${{ inputs.from-scratch == true }}
        run: |
          set -euo pipefail
          build='[]'
          for c in toolchain qemu; do
            tree=$(git rev-parse "HEAD:build/$c")
            ref="$REGISTRY/riscv-ime-sdk-$c:$tree"
            if [ "$FROM_SCRATCH" = true ]; then
              ref="$ref-verify-$GITHUB_RUN_ID"
              missing=true
            elif out=$(docker buildx imagetools inspect "$ref" 2>&1); then
              missing=false
            elif grep -qiE 'not found|manifest unknown|name unknown' <<< "$out"; then
              missing=true
            else
              # Not a missing image: rebuilding for hours would not help.
              echo "$out"
              exit 1
            fi
            echo "$c: $ref (missing: $missing)"
            echo "$c=$ref"       >> "$GITHUB_OUTPUT"
            echo "$c-tree=$tree" >> "$GITHUB_OUTPUT"
            if [ "$missing" = true ]; then
              build=$(jq -c --arg c "$c" '. + [$c]' <<< "$build")
            fi
          done
          echo "build=$build"               >> "$GITHUB_OUTPUT"
          echo "from-scratch=$FROM_SCRATCH" >> "$GITHUB_OUTPUT"

  component:
    needs: resolve
    # A pull request from a fork gets a read-only GITHUB_TOKEN and no
    # secrets, so it cannot build or push a component. It is skipped here,
    # and the sdk job then runs only if no component image was missing.
    if: >-
      needs.resolve.outputs.build != '[]'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    # No job name: GitHub does not expand a matrix expression in the name
    # of a skipped job. The default name is "component (<component>)".
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.resolve.outputs.build) }}
    runs-on: ubuntu-26.04
    # The GitHub-hosted ceiling is 6 h. A toolchain build on 2 CPUs takes 1-3 h.
    timeout-minutes: 350
    # One build per image. A second run that needs the same image waits here,
    # then finds the image in the existence check below and skips the build.
    concurrency:
      group: component-${{ needs.resolve.outputs[matrix.component] }}
      cancel-in-progress: false
    env:
      REF:  ${{ needs.resolve.outputs[matrix.component] }}
      TREE: ${{ needs.resolve.outputs[format('{0}-tree', matrix.component)] }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether another run has pushed the image
        id: check
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$REF was pushed by another run; not rebuilding"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.exists != 'true'

      - uses: ./.github/actions/free-disk
        if: steps.check.outputs.exists != 'true'

      - name: Runner resources
        if: steps.check.outputs.exists != 'true'
        run: |
          nproc; free -h; df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.check.outputs.exists != 'true'

      # The component repos are public. BuildKit fetches them anonymously.
      - name: Build and push ${{ matrix.component }}
        if: steps.check.outputs.exists != 'true'
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: ${{ env.BAKE_FILES }}
          targets: ${{ matrix.component }}
          push: true
          no-cache: ${{ needs.resolve.outputs.from-scratch }}
          set: |
            ${{ matrix.component }}.tags=${{ env.REF }}
            ${{ matrix.component }}.labels.eu.openchip.ime.tree=${{ env.TREE }}
            ${{ matrix.component }}.labels.org.opencontainers.image.revision=${{ github.sha }}

      - name: Disk usage
        if: always() && steps.check.outputs.exists != 'true'
        run: |
          df -h /
          docker buildx du || true

  sdk:
    needs: [resolve, component]
    # Run when every missing component was built, or none was missing. A
    # skipped component job with missing images means a fork pull request.
    if: >-
      !cancelled() && needs.resolve.result == 'success'
      && (needs.component.result == 'success'
          || (needs.component.result == 'skipped' && needs.resolve.outputs.build == '[]'))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # A newer push to a feature branch supersedes the running assembly.
    # Runs on main are not cancelled, so that every merged commit gets a
    # finished build. Runs on a release tag are not cancelled because they
    # publish. The from-scratch runs use their own group, so that they never
    # displace a queued run on main.
    concurrency:
      group: sdk-${{ github.ref }}${{ inputs.from-scratch == true && '-verify' || '' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release tag names the component images after itself; the resolve
      # job has checked it against sdk_version. A manual run with publish
      # uses the commit name.
      - name: Resolve the release name
        id: v
        env:
          SHA:          ${{ github.sha }}
          EVENT:        ${{ github.event_name }}
          PUBLISH_IN:   ${{ inputs.publish == true }}
          FROM_SCRATCH: ${{ needs.resolve.outputs.from-scratch }}
        run: |
          set -euo pipefail
          RELEASE=""
          if [ "$FROM_SCRATCH" = true ]; then
            RELEASE=""
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            RELEASE="$GITHUB_REF_NAME"
          elif [ "$EVENT" = workflow_dispatch ] && [ "$PUBLISH_IN" = true ]; then
            RELEASE="openchip-v${SHA::7}"
          fi
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE:-none}"

      - uses: ./.github/actions/setup-yq

      # The same command as a local build. scripts/resolve-components.sh pins
      # each component image by digest, so that the assembly is immutable
      # and the release names point at exactly the images that assembled. It
      # writes the pinned references to the step outputs. The SDK image is
      # not pushed. The assembly checks that the component images fit together; its output
      # is the build cache only.
      - name: Assemble the SDK image (not pushed)
        id: bake
        env:
          SUFFIX: ${{ needs.resolve.outputs.from-scratch == 'true' && format('-verify-{0}', github.run_id) || '' }}
        run: make sdk SDK_OUTPUT=type=cacheonly HASH_SUFFIX="$SUFFIX"

      # The tags are added in the registry, so nothing is rebuilt or
      # re-uploaded.
      - name: Name the component images after the release
        id: tag
        if: steps.v.outputs.release != ''
        env:
          RELEASE:   ${{ steps.v.outputs.release }}
          TOOLCHAIN: ${{ steps.bake.outputs.toolchain }}
          QEMU:      ${{ steps.bake.outputs.qemu }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$REGISTRY/riscv-ime-sdk-toolchain:$RELEASE" "$TOOLCHAIN"
          docker buildx imagetools create -t "$REGISTRY/riscv-ime-sdk-qemu:$RELEASE"      "$QEMU"
          echo "::notice::component images tagged $RELEASE"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

      # A re-run of an older release, or an older release run that finishes
      # last, must not move :latest back. The date in the tag name orders
      # the releases.
      - name: Move :latest of the component images to the release
        if: >-
          steps.tag.outputs.tagged == 'true'
          && github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN:  ${{ github.token }}
          TOOLCHAIN: ${{ steps.bake.outputs.toolchain }}
          QEMU:      ${{ steps.bake.outputs.qemu }}
        run: |
          set -euo pipefail
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/openchip-v" --jq '.[].ref' \
                   | sed 's|^refs/tags/||' \
                   | grep -E '^openchip-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$' | sort | tail -n 1)
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::$newest is a newer release than $GITHUB_REF_NAME; not moving :latest"
            exit 0
          fi
          docker buildx imagetools create -t "$REGISTRY/riscv-ime-sdk-toolchain:latest" "$TOOLCHAIN"
          docker buildx imagetools create -t "$REGISTRY/riscv-ime-sdk-qemu:latest"      "$QEMU"

      # One table on the run page: which component images were reused or
      # built, and the release name each component image got.
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          BUILD:        ${{ needs.resolve.outputs.build }}
          FROM_SCRATCH: ${{ needs.resolve.outputs.from-scratch }}
          TOOLCHAIN:    ${{ steps.bake.outputs.toolchain || needs.resolve.outputs.toolchain }}
          QEMU:         ${{ steps.bake.outputs.qemu || needs.resolve.outputs.qemu }}
          RELEASE:      ${{ steps.v.outputs.release }}
          TAGGED:       ${{ steps.tag.outputs.tagged }}
          ASSEMBLY:     ${{ steps.bake.outcome }}
        run: |
          set -euo pipefail
          row() { printf '| %s | %s | %s |\n' "$1" "\`$2\`" "$3"; }
          {
            echo '| image | reference | status |'
            echo '| --- | --- | --- |'
            for c in toolchain qemu; do
              case $c in toolchain) ref=$TOOLCHAIN ;; qemu) ref=$QEMU ;; esac
              if ! jq -e --arg c "$c" 'index($c)' <<< "$BUILD" >/dev/null; then
                status=reused
              elif [ "$FROM_SCRATCH" = true ]; then
                status='built with no cache'
              else
                status='built in this run'
              fi
              if [ "$TAGGED" = true ]; then
                status="$status; tagged \`$RELEASE\`"
              fi
              row "$c" "$ref" "$status"
            done
            row sdk build/sdk "assembly $ASSEMBLY; never pushed"
          } >> "$GITHUB_STEP_SUMMARY"
