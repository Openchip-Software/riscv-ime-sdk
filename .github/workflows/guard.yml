# Cheap, always-on. Runs before anything expensive. `make check` runs the
# same scripts locally.
name: guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-yq
      - name: No secrets, no internal hosts, no pins outside the lock
        run: ./scripts/check-pins.sh
      # Runs after a check-pins failure too, so that one run reports both.
      - name: components.yaml, sdk.lock.yaml and build/*/pins.hcl agree
        if: ${{ !cancelled() }}
        run: ./scripts/check-lock.sh
